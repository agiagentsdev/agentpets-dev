name: cli-auth-smoke

on:
  # Temporarily manual-only while the production Clerk custom domains are being
  # configured. Re-enable schedule/push after clerk.agentpets.dev resolves.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oauth-authorize:
    name: Production OAuth authorize smoke
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate CLI OAuth client
        working-directory: packages/petdex-cli
        # This stops before any user sign-in. It only verifies that Clerk accepts
        # the public CLI OAuth client far enough to avoid invalid_client.
        run: node scripts/oauth-authorize-smoke.mjs
